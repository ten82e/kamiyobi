name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Build merged site
        run: node src/cli.ts build --out public --offline --cache .cache
      - name: Validate generated production data
        run: npm run validate:data -- public/data.json --json
      - name: Health gate
        run: |
          curl --fail --silent --show-error --location --retry 2 \
            'https://ten82e.github.io/kamiyobi/health.json' \
            -o /tmp/last-known-good-health.json
          node scripts/health-gate.ts public/health.json --require-baseline \
            /tmp/last-known-good-health.json /tmp/next-last-known-good-health.json
      - name: Upload publish manifest for attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-manifest
          path: public/publish.json
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download publish manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-manifest
          path: public
      - name: Attest publish manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: public/publish.json

  deploy:
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
