name: update-data

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

jobs:
  generate-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Capture baseline and comparison time
        run: |
          mkdir -p /tmp/kamiyobi-update
          git rev-parse HEAD > /tmp/kamiyobi-update/main.sha
          echo "BUILD_NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build committed baseline
        run: node src/cli.ts build --out /tmp/kamiyobi-baseline --offline --no-embeddings --cache .cache --now "$BUILD_NOW"
      - name: Fetch primary sources
        run: node src/fetch-primary.ts --apply
      - name: Discover candidates
        run: node src/cli.ts discover --candidate-out data/discovered_candidates.yaml
      - name: Build source data
        run: node src/cli.ts build --out public --no-embeddings --now "$BUILD_NOW"
      - name: Validate generated production data
        run: npm run validate:data -- public/data.json --json
      - name: Health gate
        # 失敗時でも違反報告を書いて、後続の always() 診断 step が原因を残せるようにする。
        run: node scripts/health-gate.ts public/health.json --require-baseline /tmp/kamiyobi-baseline/health.json /tmp/next-last-known-good-health.json --report /tmp/kamiyobi-update/health-violations.json
      - name: Recommendation Top-5 delta
        if: always() && hashFiles('public/recommendation-index.json') != ''
        run: npm run --silent bench -- --data-delta tests/fixtures/recommendation-data-delta.json --data-delta-before /tmp/kamiyobi-baseline/recommendation-index.json --data-delta-after public/recommendation-index.json --json > /tmp/kamiyobi-update/recommendation-delta.json
      - name: Summarize category changes
        if: always()
        run: |
          mkdir -p /tmp/kamiyobi-update/data
          node --input-type=module <<'NODE' > /tmp/kamiyobi-update/category-delta.md
          import { readFileSync } from "node:fs";
          import { summarizeCategoryChanges } from "./scripts/validate-data.ts";
          const before = JSON.parse(readFileSync("/tmp/kamiyobi-baseline/data.json", "utf8"));
          const after = JSON.parse(readFileSync("public/data.json", "utf8"));
          console.log(summarizeCategoryChanges(before, after).summary);
          NODE
          cp public/health.json /tmp/kamiyobi-update/health.json 2>/dev/null || true
          cp data/snapshot.json data/primary_overrides.yaml data/discovered_candidates.yaml \
            /tmp/kamiyobi-update/data/
          mkdir -p /tmp/kamiyobi-update/baseline /tmp/kamiyobi-update/current
          cp /tmp/kamiyobi-baseline/data.json /tmp/kamiyobi-update/baseline/data.json 2>/dev/null || true
          cp /tmp/kamiyobi-baseline/health.json /tmp/kamiyobi-update/baseline/health.json 2>/dev/null || true
          cp public/data.json /tmp/kamiyobi-update/current/data.json 2>/dev/null || true
          test -f /tmp/kamiyobi-update/health-violations.json || echo '{"ok":true,"reasons":[],"warnings":[],"baseline_available":false,"current_path":"public/health.json","previous_path":null}' > /tmp/kamiyobi-update/health-violations.json
      - name: Summarize deadline semantic changes
        if: always()
        run: |
          node --input-type=module <<'NODE' > /tmp/kamiyobi-update/deadline-delta.md
          import { readFileSync } from "node:fs";
          import { summarizeDeadlineChanges } from "./scripts/validate-data.ts";
          const before = JSON.parse(readFileSync("/tmp/kamiyobi-baseline/data.json", "utf8"));
          const after = JSON.parse(readFileSync("public/data.json", "utf8"));
          console.log(summarizeDeadlineChanges(before, after).summary);
          NODE
      - name: Summarize blocked update
        if: failure()
        run: |
          {
            echo "### update-data blocked by health gate"
            echo '```text'
            node -e '
              const fs = require("node:fs");
              try {
                const r = JSON.parse(fs.readFileSync("/tmp/kamiyobi-update/health-violations.json", "utf8"));
                for (const reason of r.reasons) console.log("- " + reason);
              } catch { console.log("- (violation report unavailable)"); }
            '
            echo '```'
            echo "Diagnosis artifacts are in the generated-update artifact (baseline/, current/, health-violations.json)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload generated update
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-update
          if-no-files-found: error
          path: /tmp/kamiyobi-update

  write-data-pr:
    needs: generate-data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pushed: ${{ steps.write.outputs.pushed }}
      used-app-token: ${{ steps.write.outputs.used-app-token }}
    concurrency:
      group: automation-data-update-writer
      cancel-in-progress: false
    env:
      KAMIYOBI_APP_CLIENT_ID: ${{ secrets.KAMIYOBI_APP_CLIENT_ID }}
      KAMIYOBI_APP_PRIVATE_KEY: ${{ secrets.KAMIYOBI_APP_PRIVATE_KEY }}
    steps:
      - name: Create GitHub App token
        id: app-token
        if: ${{ env.KAMIYOBI_APP_CLIENT_ID != '' && env.KAMIYOBI_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KAMIYOBI_APP_CLIENT_ID }}
          private-key: ${{ secrets.KAMIYOBI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Download generated update
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-update
          path: /tmp/kamiyobi-update
      - name: Restore generated data
        run: cp /tmp/kamiyobi-update/data/* data/
      - name: Create or update guarded data PR
        id: write
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch=automation/data-update
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if [ -n "$APP_TOKEN" ]; then
            echo "used-app-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "used-app-token=false" >> "$GITHUB_OUTPUT"
          fi
          start_sha=$(cat /tmp/kamiyobi-update/main.sha)
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$start_sha"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          existing_branch=false
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            existing_branch=true
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          pr_number=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number')

          snap_changed=$(node scripts/compare-head.ts data/snapshot.json)
          primary_changed=$(node scripts/compare-head.ts data/primary_overrides.yaml)
          candidate_changed=$(node scripts/compare-head.ts data/discovered_candidates.yaml)
          if [ "$snap_changed" != 1 ] && [ "$primary_changed" != 1 ] && [ "$candidate_changed" != 1 ]; then
            if [ -n "$pr_number" ]; then gh pr close "$pr_number"; fi
            if [ "$existing_branch" = true ]; then git push origin --delete "$branch"; fi
            exit 0
          fi

          git switch -C "$branch"
          if [ "$snap_changed" = 1 ]; then git add data/snapshot.json; fi
          if [ "$primary_changed" = 1 ]; then git add data/primary_overrides.yaml; fi
          if [ "$candidate_changed" = 1 ]; then git add data/discovered_candidates.yaml; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update deadline data'
          git push --force-with-lease=refs/heads/$branch origin "$branch"

          node --input-type=module <<'NODE' > /tmp/data-pr-body.md
          import { readFileSync } from "node:fs";
          const health = JSON.parse(readFileSync("/tmp/kamiyobi-update/health.json", "utf8"));
          const recommendation = JSON.parse(readFileSync("/tmp/kamiyobi-update/recommendation-delta.json", "utf8"));
          const categoryChanges = readFileSync("/tmp/kamiyobi-update/category-delta.md", "utf8").trim();
          const deadlineChanges = readFileSync("/tmp/kamiyobi-update/deadline-delta.md", "utf8").trim();
          console.log("## Automated data update");
          console.log(`- health: tracked venues ${health.tracked_venues}; source failures: ${health.source_failures.length ? health.source_failures.join(", ") : "none"}; warnings: ${health.parse_warning_count}`);
          console.log(`- recommendation Top-5 changes: ${recommendation.changed_top5.length ? recommendation.changed_top5.join(", ") : "none"}`);
          console.log(`- new venues in Top-5: ${recommendation.new_venues_in_top5.length ? recommendation.new_venues_in_top5.join(", ") : "none"}`);
          console.log("## Validator category changes");
          console.log(categoryChanges);
          console.log("## Deadline semantic changes");
          console.log(deadlineChanges);
          NODE
          if [ -n "$pr_number" ]; then
            if ! gh pr edit "$pr_number" --title 'chore: update deadline data' --body-file /tmp/data-pr-body.md; then
              git push origin --delete "$branch"
              exit 1
            fi
          elif ! gh pr create --base main --head "$branch" --title 'chore: update deadline data' --body-file /tmp/data-pr-body.md; then
            git push origin --delete "$branch"
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  trigger-fallback-ci:
    needs: write-data-pr
    if: ${{ needs.write-data-pr.outputs.pushed == 'true' && needs.write-data-pr.outputs.used-app-token == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger CI for GITHUB_TOKEN update
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref automation/data-update --repo "$GITHUB_REPOSITORY"
