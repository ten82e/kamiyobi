name: recommendation-bundle

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: node src/cli.ts build --out public --offline --cache .cache --now 2026-08-09T00:00:00Z
      - run: node src/bench-recommender.ts --real-v2-dev data/benchmarks/real-paper-required-dev.json --real-v2-heldout data/benchmarks/real-paper-required-heldout.json --real-v2-negative data/benchmarks/real-paper-negative.json --real-v2-features data/benchmarks/real-paper-required-features.json --real-v2-small --json
      - name: Seal recommendation bundle
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          const bytes = readFileSync("public/embeddings.json");
          const embedding = JSON.parse(bytes);
          const manifest = embedding.manifest;
          if (!manifest?.profile_hash || !manifest?.runtime_version || !manifest.models?.en?.revision) throw new Error("invalid embedding manifest");
          writeFileSync("public/recommendation-bundle.json", `${JSON.stringify({ source_commit: process.env.GITHUB_SHA, profile_hash: manifest.profile_hash, model_revision: manifest.models.en.revision, runtime_version: manifest.runtime_version, embeddings_sha256: createHash("sha256").update(bytes).digest("hex"), benchmark_status: "passed" }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recommendation-bundle-${{ github.sha }}
          path: |
            public/embeddings.json
            public/recommendation-bundle.json
          if-no-files-found: error
