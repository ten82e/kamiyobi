name: recommendation-bundle

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - name: Install dependencies (with retry)
        run: |
          for i in 1 2 3; do npm ci && break || sleep 15; done
      - name: Build site without embeddings
        run: node src/cli.ts build --out public --offline --no-embeddings --cache .cache --now 2026-08-09T00:00:00Z
      # semantic_content_id = embeddingProfileHash(data.json) + reranker hash + algorithm revision
      # + feature schema + model revisions + runtime。src/semantic-content.ts が唯一の算出式で、
      # seal 側も同一関数で再計算して一致を強制する。
      - name: Compute semantic content id
        id: content
        run: echo "id=$(node scripts/semantic-content.ts public/data.json)" >> "$GITHUB_OUTPUT"
      # 埋め込み生成の前に再利用判定。締切だけの push ではモデルを読み込まない。
      - name: Reuse sealed bundle or mark semantic change
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_ID: ${{ steps.content.outputs.id }}
        run: |
          mkdir -p public
          for run in $(gh api "repos/${{ github.repository }}/actions/workflows/recommendation-bundle.yml/runs?branch=main&status=success&per_page=15" --jq '.workflow_runs[] | .id'); do
            rm -rf /tmp/kamiyobi-reuse && mkdir -p /tmp/kamiyobi-reuse
            gh run download "$run" --dir /tmp/kamiyobi-reuse 2>/dev/null || continue
            manifest=$(find /tmp/kamiyobi-reuse -name recommendation-bundle.json | head -1)
            [ -n "$manifest" ] || continue
            if node -e '
              const fs = require("node:fs");
              const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.exit(
                m.semantic_content_id === process.env.CONTENT_ID &&
                m.required_gate === "passed" &&
                m.full_benchmark === "passed"
                  ? 0 : 1);
            ' "$manifest"; then
              echo "reusing sealed bundle from run $run (semantic content unchanged)"
              cp "$(dirname "$manifest")/embeddings.json" public/embeddings.json
              cp "$manifest" public/recommendation-bundle.json
              echo "reused=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "reused=false" >> "$GITHUB_OUTPUT"
          echo "no reusable sealed bundle; embeddings and full benchmark required"
      - name: Generate embeddings
        if: steps.bundle.outputs.reused != 'true'
        run: node src/embeddings.ts public/data.json public/embeddings.json
      - name: Run required gate (fast subset)
        if: steps.bundle.outputs.reused != 'true'
        run: node src/bench-recommender.ts --real-v2-dev data/benchmarks/real-paper-required-dev.json --real-v2-heldout data/benchmarks/real-paper-required-heldout.json --real-v2-negative data/benchmarks/real-paper-negative.json --real-v2-features data/benchmarks/real-paper-required-features.json --real-v2-small --json > /dev/null
      # 推薦内容が変わった push だけ full benchmark を走らせ、合格後でないと seal しない。
      - name: Run full real-paper benchmark before sealing
        if: steps.bundle.outputs.reused != 'true'
        run: |
          node src/bench-recommender.ts \
            --data public/data.json \
            --real-v2-dev data/benchmarks/real-paper-dev.json \
            --real-v2-heldout data/benchmarks/real-paper-heldout.json \
            --real-v2-negative data/benchmarks/real-paper-negative.json \
            --json > /tmp/full-bench.json
          jq '{dev: .splits.dev.modes.fused.recall_at_5, heldout: .splits.heldout.modes.fused.recall_at_5}' /tmp/full-bench.json
      - name: Seal recommendation bundle
        if: steps.bundle.outputs.reused != 'true'
        run: |
          node scripts/seal-recommendation-bundle.ts public/embeddings.json public/data.json public/recommendation-bundle.json "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recommendation-bundle-${{ github.sha }}
          path: |
            public/embeddings.json
            public/recommendation-bundle.json
          if-no-files-found: error
