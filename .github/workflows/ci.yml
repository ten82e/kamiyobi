name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run typecheck
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run check
  unit-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm test
  offline-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: node src/cli.ts build --out /tmp/kamiyobi-offline-site --offline --no-embeddings --cache /tmp/kamiyobi-offline-cache --now 2026-08-09T00:00:00Z
      - name: Check offline result
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const out = "/tmp/kamiyobi-offline-site";
          for (const name of ["data.json", "health.json", "publish.json", "app.js", "recommender.js", "recommendation-core.js", "publish.js"]) {
            if (!fs.existsSync(`${out}/${name}`) || fs.statSync(`${out}/${name}`).size === 0) throw new Error(`missing ${name}`);
          }
          const data = JSON.parse(fs.readFileSync(`${out}/data.json`, "utf8"));
          const health = JSON.parse(fs.readFileSync(`${out}/health.json`, "utf8"));
          const publish = JSON.parse(fs.readFileSync(`${out}/publish.json`, "utf8"));
          if (data.conferences.length < 150 || health.tracked_venues < 150 || !health.output_files["data.json"]) throw new Error("offline data/health contract failed");
          if (publish.semantic_status !== "lexical-only" || !publish.artifacts["recommendation-index.json"]) throw new Error("offline publish contract failed");
          NODE
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run validate:data -- --json
  health-transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm test -- --run tests/health_gate.test.ts
  recommendation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Build current recommendation index
        run: node src/cli.ts build --out /tmp/kamiyobi-current-recommendation --offline --no-embeddings --cache /tmp/kamiyobi-cache --now 2026-08-09T00:00:00Z
      - name: Build pull-request base recommendation index
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git worktree add --detach /tmp/kamiyobi-base-recommendation "origin/${{ github.base_ref }}"
          cd /tmp/kamiyobi-base-recommendation
          npm ci
          node src/cli.ts build --out /tmp/kamiyobi-base-public --offline --no-embeddings --cache /tmp/kamiyobi-cache --now 2026-08-09T00:00:00Z
      - name: Compare recommendation indexes
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run bench -- --data-delta tests/fixtures/recommendation-data-delta.json --data-delta-before /tmp/kamiyobi-base-public/recommendation-index.json --data-delta-after /tmp/kamiyobi-current-recommendation/recommendation-index.json --json
      - name: Run deterministic fixture regression
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run bench -- --data-delta tests/fixtures/recommendation-data-delta.json --json
