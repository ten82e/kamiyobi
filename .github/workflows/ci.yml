name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - name: Install dependencies (with retry)
        run: |
          for i in 1 2 3; do npm ci && break; [ "$i" -lt 3 ] || exit 1; sleep 15; done
      - run: npm run typecheck
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - name: Install dependencies (with retry)
        run: |
          for i in 1 2 3; do npm ci && break; [ "$i" -lt 3 ] || exit 1; sleep 15; done
      - run: npm run check
  unit-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - name: Install dependencies (with retry)
        run: |
          for i in 1 2 3; do npm ci && break; [ "$i" -lt 3 ] || exit 1; sleep 15; done
      - name: Build real-data test fixture
        run: node src/cli.ts build --out public --offline --no-embeddings --cache /tmp/kamiyobi-test-cache --now 2026-08-09T00:00:00Z
      - run: npm test
  offline-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - name: Install dependencies (with retry)
        run: |
          for i in 1 2 3; do npm ci && break; [ "$i" -lt 3 ] || exit 1; sleep 15; done
      - run: node src/cli.ts build --out /tmp/kamiyobi-offline-site --offline --no-embeddings --cache /tmp/kamiyobi-offline-cache --now 2026-08-09T00:00:00Z
      - name: Check offline result
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const out = "/tmp/kamiyobi-offline-site";
          for (const name of ["data.json", "health.json", "publish.json", "app.js", "recommender.js", "recommendation-core.js", "publish.js"]) {
            if (!fs.existsSync(`${out}/${name}`) || fs.statSync(`${out}/${name}`).size === 0) throw new Error(`missing ${name}`);
          }
          const data = JSON.parse(fs.readFileSync(`${out}/data.json`, "utf8"));
          const health = JSON.parse(fs.readFileSync(`${out}/health.json`, "utf8"));
          const publish = JSON.parse(fs.readFileSync(`${out}/publish.json`, "utf8"));
          if (data.conferences.length < 150 || health.tracked_venues < 150 || !health.output_files["data.json"]) throw new Error("offline data/health contract failed");
          if (publish.semantic_status !== "lexical-only" || !publish.artifacts["recommendation-index.json"]) throw new Error("offline publish contract failed");
          NODE
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - name: Install dependencies (with retry)
        run: |
          for i in 1 2 3; do npm ci && break; [ "$i" -lt 3 ] || exit 1; sleep 15; done
      - run: npm run validate:data -- --json
  health-transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - name: Install dependencies (with retry)
        run: |
          for i in 1 2 3; do npm ci && break; [ "$i" -lt 3 ] || exit 1; sleep 15; done
      - run: npm test -- --run tests/health_gate.test.ts
  production-health-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - name: Install dependencies (with retry)
        run: |
          for i in 1 2 3; do npm ci && break; [ "$i" -lt 3 ] || exit 1; sleep 15; done
      - name: Build offline production data
        run: node src/cli.ts build --out /tmp/kamiyobi-self-check --offline --no-embeddings --cache /tmp/kamiyobi-cache --now 2026-08-09T00:00:00Z
      - name: Validate production data schema
        run: npm run validate:data -- /tmp/kamiyobi-self-check/data.json --json
      - name: Health gate (current-state, no baseline)
        run: node scripts/health-gate.ts /tmp/kamiyobi-self-check/health.json
      - name: Save diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/kamiyobi-diagnostics
          cp /tmp/kamiyobi-self-check/health.json /tmp/kamiyobi-diagnostics/health.json
          cp /tmp/kamiyobi-self-check/data.json /tmp/kamiyobi-diagnostics/data.json
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-health-diagnostics
          path: /tmp/kamiyobi-diagnostics/
          if-no-files-found: warn
  recommendation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - name: Install dependencies (with retry)
        run: |
          for i in 1 2 3; do npm ci && break; [ "$i" -lt 3 ] || exit 1; sleep 15; done
      - name: Build current recommendation index
        run: node src/cli.ts build --out /tmp/kamiyobi-current-recommendation --offline --no-embeddings --cache /tmp/kamiyobi-cache --now 2026-08-09T00:00:00Z
      - name: Build pull-request base recommendation index
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git worktree add --detach /tmp/kamiyobi-base-recommendation "origin/${{ github.base_ref }}"
          cd /tmp/kamiyobi-base-recommendation
          npm ci
          node src/cli.ts build --out /tmp/kamiyobi-base-public --offline --no-embeddings --cache /tmp/kamiyobi-cache --now 2026-08-09T00:00:00Z
      - name: Compare recommendation indexes
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run bench -- --data-delta tests/fixtures/recommendation-data-delta.json --data-delta-before /tmp/kamiyobi-base-public/recommendation-index.json --data-delta-after /tmp/kamiyobi-current-recommendation/recommendation-index.json --json
      - name: Run deterministic fixture regression
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run bench -- --data-delta tests/fixtures/recommendation-data-delta.json --json
      - name: Run fixed semantic-score recommendation gate
        run: node src/bench-recommender.ts --v2 tests/fixtures/bench-v2.json --json > /tmp/recommendation-required.json
      - name: Run deterministic real-paper production gate
        run: |
          node src/bench-recommender.ts \
            --data /tmp/kamiyobi-current-recommendation/data.json \
            --real-v2-dev data/benchmarks/real-paper-required-dev.json \
            --real-v2-heldout data/benchmarks/real-paper-required-heldout.json \
            --real-v2-negative data/benchmarks/real-paper-negative.json \
            --real-v2-features data/benchmarks/real-paper-features.jsonl \
            --real-v2-small \
            --json > /tmp/real-paper-required.json
      - name: Upload fixed recommendation gate report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recommendation-required-report
          path: /tmp/recommendation-required.json
          if-no-files-found: error
      - name: Upload real-paper recommendation gate report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-paper-required-report
          path: /tmp/real-paper-required.json
          if-no-files-found: error

  report-dispatch-statuses:
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [typecheck, lint, unit-integration-tests, offline-build, validate-data, health-transition, production-health-self-check, recommendation-regression]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Report required dispatch statuses
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          overall=success
          for context in typecheck lint unit-integration-tests offline-build validate-data health-transition production-health-self-check recommendation-regression; do
            result=$(jq -r --arg context "$context" '.[$context].result' <<< "$RESULTS")
            state=success
            if [ "$result" != success ]; then state=failure; overall=failure; fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" \
              -f context="$context" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              -f description="workflow_dispatch CI: $result"
          done
          test "$overall" = success
