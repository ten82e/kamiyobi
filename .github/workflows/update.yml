name: update

on:
  schedule:
    # 20:17 UTC = 05:17 JST（毎日）
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Capture starting main SHA
        id: start-main
        run: echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix comparison time
        run: echo "BUILD_NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # The committed baseline is built before any generator writes.  The same
      # fixture and browser recommender are used later for a real Top-5 delta.
      - name: Build committed baseline
        run: node src/cli.ts build --out /tmp/kamiyobi-baseline --offline --no-embeddings --cache .cache --now "$BUILD_NOW"

      # 一次ソースの自動抽出 (data/primary.yaml → data/primary_overrides.yaml)。
      # 抽出失敗の会議は前回値を維持するので、サイトが一時的に落ちていても安全。
      - name: Fetch primary sources
        run: node src/fetch-primary.ts --apply

      - name: Discover candidates for the single writer
        # candidate discovery never writes main; this sole job owns any later PR.
        run: node src/cli.ts discover --candidate-out data/discovered_candidates.yaml || echo 'discovery failed; keeping previous candidates'

      # 上流取得に失敗しても、コミット済み data/snapshot.json から生成を続ける
      # (SPEC.md 3.5)。推薦 bundle は後段で cache から復元・検証し、失敗時は
      # recommendation-index.json だけを残してサイトの語彙 fallback を使う。
      - name: Build deadline bundle
        id: build
        run: node src/cli.ts build --out public --no-embeddings --now "$BUILD_NOW"

      - name: Validate generated production data
        run: npm run validate:data -- public/data.json --json

      - name: Compute recommendation bundle key
        id: recommendation-key
        run: |
          bundle_key=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { embeddingBundleKey, embeddingProfileHash } from "./src/embeddings.ts"; const data = JSON.parse(readFileSync("public/data.json", "utf8")); process.stdout.write(embeddingBundleKey(embeddingProfileHash(data)));')
          echo "key=$bundle_key" >> "$GITHUB_OUTPUT"

      - name: Restore recommendation bundle
        id: restore-recommendation
        uses: actions/cache/restore@v4
        with:
          path: public/embeddings.json
          key: ${{ steps.recommendation-key.outputs.key }}

      - name: Generate recommendation bundle
        if: ${{ steps.restore-recommendation.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: node src/embeddings.ts public/data.json public/embeddings.json

      - name: Validate recommendation bundle
        id: validate-recommendation
        if: ${{ always() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, rmSync } from "node:fs";
          import { embeddingsStale } from "./src/build.ts";
          try {
            const data = JSON.parse(readFileSync("public/data.json", "utf8"));
            const embeddings = JSON.parse(readFileSync("public/embeddings.json", "utf8"));
            if (embeddingsStale(embeddings, data)) {
              throw new Error("recommendation bundle is missing or stale");
            }
          } catch (error) {
            rmSync("public/embeddings.json", { force: true });
            throw error;
          }
          NODE

      # 公開済み health.json を last-known-good として、致命的なデータ縮退を
      # Pages artifact に載せる前に止める。推薦 bundle の失敗に関係なく、
      # deadline build が成功したときは health gate を検査する。
      - name: Health gate
        id: health-gate
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            'https://ten82e.github.io/kamiyobi/health.json' \
            -o /tmp/last-known-good-health.json || rm -f /tmp/last-known-good-health.json
          if [ -f /tmp/last-known-good-health.json ]; then
            node scripts/health-gate.ts public/health.json --require-baseline /tmp/last-known-good-health.json /tmp/next-last-known-good-health.json
          else
            node scripts/health-gate.ts public/health.json --require-baseline '' /tmp/next-last-known-good-health.json
          fi

      - name: Save recommendation bundle
        if: ${{ always() && steps.validate-recommendation.outcome == 'success' && steps.restore-recommendation.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: public/embeddings.json
          key: ${{ steps.recommendation-key.outputs.key }}

      # publish.json は復元・生成後の最終成果物を対象にする。初期 build の
      # lexical-only マニフェストをここで確定ハッシュ付きの状態へ置き換える。
      - name: Write final publish manifest
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.health-gate.outcome == 'success' }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readdirSync, readFileSync, statSync } from "node:fs";
          import { join } from "node:path";
          import { writePublishManifest } from "./src/build.ts";
          const data = JSON.parse(readFileSync("public/data.json", "utf8"));
          const files = readdirSync("public").filter((name) =>
            statSync(join("public", name)).isFile(),
          );
          const semanticStatus = existsSync("public/embeddings.json") ? "ready" : "lexical-only";
          writePublishManifest("public", files, new Date(data.generated_at), semanticStatus);
          NODE

      # スナップショットは上流が変わった日にだけ更新される。
      # SPEC.md 6 のとおり、活動を偽装するハートビートコミットは実装しない。
      # snapshot と primary_overrides のどちらかに実質変更があるときだけ
      # 両方をコミットする（_comment の抽出日付の変化だけではコミットしない）。
      - name: Recommendation Top-5 delta
        if: ${{ steps.build.outcome == 'success' }}
        run: npm run bench -- --data-delta tests/fixtures/recommendation-data-delta.json --data-delta-before /tmp/kamiyobi-baseline/recommendation-index.json --data-delta-after public/recommendation-index.json --json > /tmp/recommendation-delta.json

      # This is deliberately outside the optional PR API operation: a moved main
      # invalidates every generated artifact, including the Pages upload.
      - name: Verify main has not moved
        id: main-guard
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.health-gate.outcome == 'success' }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.start-main.outputs.sha }}"

      - name: Create guarded data PR
        if: ${{ !cancelled() && steps.main-guard.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ ! -f data/snapshot.json ]; then
            echo 'no snapshot produced; nothing to commit'
            exit 0
          fi

          # 実質差分（generated_at / _comment は無視・キー順序は正規化）を
          # HEAD と比較し、snapshot / primary / discovery candidate のいずれかが
          # 実質的に変わったときだけ、この唯一の writer が該当ファイルを残す。
          snap_changed=$(node scripts/compare-head.ts data/snapshot.json)
          primary_changed=$(node scripts/compare-head.ts data/primary_overrides.yaml)
          candidate_changed=$(node scripts/compare-head.ts data/discovered_candidates.yaml)

          if [ "$snap_changed" != '1' ] && [ "$primary_changed" != '1' ] && [ "$candidate_changed" != '1' ]; then
            echo 'no substantive change; nothing to commit'
            exit 0
          fi

          branch="automation/data-${{ github.run_id }}"
          git switch -c "$branch"
          if [ "$snap_changed" = '1' ]; then git add data/snapshot.json; fi
          if [ "$primary_changed" = '1' ]; then git add data/primary_overrides.yaml; fi
          if [ "$candidate_changed" = '1' ]; then git add data/discovered_candidates.yaml; fi
          git commit -m 'chore: update deadline data'
          git push origin "$branch"
          node --input-type=module <<'NODE' > /tmp/data-pr-body.md
          import { readFileSync } from "node:fs";
          const baselineData = JSON.parse(readFileSync("/tmp/kamiyobi-baseline/data.json", "utf8"));
          const baselineHealth = JSON.parse(readFileSync("/tmp/kamiyobi-baseline/health.json", "utf8"));
          const health = JSON.parse(readFileSync("public/health.json", "utf8"));
          const data = JSON.parse(readFileSync("public/data.json", "utf8"));
          const venueKeys = (value) => new Set((value.conferences || []).map((conference) => conference.key));
          const beforeKeys = venueKeys(baselineData);
          const afterKeys = venueKeys(data);
          const delta = (field) => Number(health[field] || 0) - Number(baselineHealth[field] || 0);
          const sourceStatus = (value) => value.source_status || {};
          const beforeStatus = sourceStatus(baselineHealth);
          const afterStatus = sourceStatus(health);
          const sourceTransitions = [...new Set([...Object.keys(beforeStatus), ...Object.keys(afterStatus)])]
            .sort()
            .map((source) => `${source}: ${beforeStatus[source] || "absent"}→${afterStatus[source] || "absent"}`)
            .filter((value) => {
              const [, transition] = value.split(": ");
              const [before, after] = transition.split("→");
              return before !== after;
            });
          const confirmed = (value) => Number(value.future_exact_deadlines || 0) + Number(value.future_date_only_deadlines || 0);
          console.log("## Automated data update");
          console.log(`- conferences: +${[...afterKeys].filter((key) => !beforeKeys.has(key)).length} / -${[...beforeKeys].filter((key) => !afterKeys.has(key)).length} (now ${afterKeys.size})`);
          console.log(`- precision deltas: exact ${delta("future_exact_deadlines") >= 0 ? "+" : ""}${delta("future_exact_deadlines")}, date-only ${delta("future_date_only_deadlines") >= 0 ? "+" : ""}${delta("future_date_only_deadlines")}, estimated ${delta("future_estimated_deadlines") >= 0 ? "+" : ""}${delta("future_estimated_deadlines")}`);
          console.log(`- source states: ${Object.entries(health.source_metadata || health.source_status).map(([key, value]) => `${key}=${typeof value === "string" ? value : value.status}`).join(", ")}`);
          console.log(`- health transitions: sources ${sourceTransitions.length ? sourceTransitions.join(", ") : "none"}; tracked venues ${delta("tracked_venues") >= 0 ? "+" : ""}${delta("tracked_venues")}; future confirmed ${confirmed(health) - confirmed(baselineHealth) >= 0 ? "+" : ""}${confirmed(health) - confirmed(baselineHealth)}; future estimated ${delta("future_estimated_deadlines") >= 0 ? "+" : ""}${delta("future_estimated_deadlines")}`);
          console.log(`- source failures: ${health.source_failures.length ? health.source_failures.join(", ") : "none"}`);
          console.log(`- warnings: ${health.parse_warning_count}`);
          const report = JSON.parse(readFileSync("/tmp/recommendation-delta.json", "utf8"));
          console.log(`- recommendation Top-5 changes: ${report.changed_top5.length ? report.changed_top5.join(", ") : "none"}`);
          console.log(`- new venues in Top-5: ${report.new_venues_in_top5.length ? report.new_venues_in_top5.join(", ") : "none"}`);
          console.log(`- expected venues falling out: ${report.expected_venues_dropped.length ? report.expected_venues_dropped.join(", ") : "none"}`);
          NODE
          gh pr create --base main --head "$branch" --title 'chore: update deadline data' --body-file /tmp/data-pr-body.md

      # 配信は締切 build と health gate の成否で決める。推薦埋め込みが無い
      # 場合も recommendation-index.json と語彙 fallback は公開する。
      # データ commit/push の失敗でその日の配信ごと落とさない。
      - name: Upload Pages artifact
        if: ${{ !cancelled() && steps.main-guard.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Verify main immediately before deploy
        id: deploy-guard
        if: ${{ !cancelled() && steps.main-guard.outcome == 'success' }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.start-main.outputs.sha }}"

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ !cancelled() && steps.deploy-guard.outcome == 'success' }}
        uses: actions/deploy-pages@v5
