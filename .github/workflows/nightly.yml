name: nightly

on:
  schedule:
    - cron: '0 3 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# nightly は full benchmark・drift 検出の定期評価専用。bundle の seal/upload と
# Pages deploy は recommendation-bundle.yml が担当するため、ここでは行わない。
jobs:
  full-recommendation-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - name: Install dependencies
        run: |
          for i in 1 2 3; do npm ci && break; [ "$i" -lt 3 ] || exit 1; sleep 15; done
      - name: Build benchmark data
        run: node src/cli.ts build --out public --offline --cache .cache --now 2026-08-09T00:00:00Z
      - name: Run full real-paper benchmark
        run: |
          node src/bench-recommender.ts \
            --real-v2-dev data/benchmarks/real-paper-dev.json \
            --real-v2-heldout data/benchmarks/real-paper-heldout.json \
            --real-v2-negative data/benchmarks/real-paper-negative.json \
            > /tmp/real-paper-full.json
          jq '{regression_floor, dev: .splits.dev.modes.fused, heldout: .splits.heldout.modes.fused, negative: .splits.negative}' \
            /tmp/real-paper-full.json
      - name: Upload full real-paper report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-paper-full-report
          path: /tmp/real-paper-full.json
          if-no-files-found: error
      - name: Generate reverification manifest
        run: node scripts/reverification-manifest.ts --data public/data.json --json > /tmp/reverification-manifest.json
      - name: Upload reverification manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reverification-manifest
          path: /tmp/reverification-manifest.json
          if-no-files-found: warn
